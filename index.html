<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Anaemia Mukt Bharat</title>
<meta name="theme-color" content="#e31e24">
<meta name="description" content="Anaemia Mukt Bharat – screening & treatment guide. Works offline.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AMB">
<style>
:root{--red:#e31e24;--navy:#14213d;--bg:#fff7f5;--card:#fff;--line:#f0d9d6;--ink:#1d1d24;--mute:#6b6b78;--ok:#1b7f3b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Oriya","Noto Sans",sans-serif;background:var(--bg);color:var(--ink);padding-top:env(safe-area-inset-top)}
header{position:sticky;top:0;z-index:5;background:var(--red);color:#fff;display:flex;align-items:center;gap:10px;padding:8px 12px}
header img{width:38px;height:38px;border-radius:10px;background:#fff;padding:2px}
header h1{font-size:15px;min-width:0;margin:0;flex:1;line-height:1.1}
header h1 small{display:block;font-weight:400;opacity:.85;font-size:11px}
.pill{border:1.5px solid #fff;background:transparent;color:#fff;border-radius:99px;padding:5px 10px;font:600 12px inherit;font-family:inherit;display:flex;align-items:center;gap:5px;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:#3ddc6b}.pill.off .dot{background:#ffd23f}.pill.off{background:#fff;color:var(--red)}
#lang{position:fixed;right:14px;bottom:calc(74px + env(safe-area-inset-bottom));z-index:7;border:0;border-radius:99px;padding:12px 18px;background:var(--navy);color:#fff;font:700 15px inherit;font-family:inherit;box-shadow:0 4px 14px #0004}
.pill.on{background:#fff;color:var(--red)}
main{padding:12px 12px calc(84px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
.tab{display:none}.tab.on{display:block}
.cover{width:100%;border-radius:18px;display:block;box-shadow:0 6px 24px #14213d22}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font:700 17px inherit;font-family:inherit;background:var(--red);color:#fff;margin-top:14px}
.btn.alt{background:var(--navy)}.btn.ghost{background:#fff;color:var(--red);border:2px solid var(--red)}
.q{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.q.err{border-color:var(--red);background:#fff1f0}
.q[hidden]{display:none}
.lbl{font-weight:650;margin-bottom:8px;white-space:pre-line}.lbl i{color:var(--red);font-style:normal}
.q input[type=text],.q input[type=number],.q input[type=date]{width:100%;font:inherit;font-size:18px;padding:12px;border:1.5px solid #d8c7c4;border-radius:10px;background:#fff}
.q input:focus{outline:3px solid #e31e2433;border-color:var(--red)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts label{flex:1 1 140px;display:flex;align-items:center;gap:8px;border:1.5px solid #d8c7c4;border-radius:10px;padding:11px;font-weight:500;background:#fff}
.opts input{accent-color:var(--red);width:20px;height:20px;margin:0}
.opts label:has(input:checked){border-color:var(--red);background:#ffecea}
.note{background:#fffdf3;border-color:#f1e4a8;white-space:pre-line;word-break:break-word}
.note a{color:#0b5cad;font-weight:700}
.msg{color:var(--red);font-size:13px;margin-top:6px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;border:0;background:none;padding:9px 0 7px;font:600 12px inherit;font-family:inherit;color:var(--mute)}
nav button span{display:block;font-size:21px}nav button.on{color:var(--red)}
.rec{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.rec b{font-size:17px}.rec .row{display:flex;gap:8px;margin-top:10px}.rec .row button,.rec .row a{flex:1;text-align:center;text-decoration:none;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:9px;font:600 14px inherit;font-family:inherit;color:var(--navy)}
.tag{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700;background:#eee;margin-right:4px}
.tag.Severe{background:#ffd6d6;color:#b00}.tag.Moderate{background:#ffe8c7;color:#8a4b00}.tag.Mild{background:#fff3b8;color:#6b5800}.tag.No{background:#d9f5e0;color:var(--ok)}
.empty{text-align:center;color:var(--mute);padding:40px 10px}
#toast{position:fixed;left:50%;bottom:140px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:99px;opacity:0;transition:.25s;pointer-events:none;z-index:9}#toast.on{opacity:1}
.pill.inst{background:#fff;color:var(--red);animation:pulse 1.8s infinite}@keyframes pulse{50%{box-shadow:0 0 0 5px #fff6}}
.sec{font-size:17px;color:var(--navy);margin:22px 2px 4px}.pic{margin-top:12px}
@media(max-width:400px){header h1 small{display:none}header{gap:6px}.pill{padding:5px 8px}}
#upd{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top));transform:translateX(-50%);width:min(94%,440px);background:#fff;border:1.5px solid var(--line);border-radius:16px;box-shadow:0 8px 28px #0003;padding:10px 12px;display:flex;align-items:center;gap:12px;z-index:20}
#upd[hidden]{display:none}.utx{flex:1;min-width:0}.utx b{display:block}.utx small{color:var(--mute)}
.ubtn{display:flex;flex-direction:column;gap:5px}.ubtn button{border:0;border-radius:9px;padding:8px 12px;font:700 13px inherit;font-family:inherit;background:var(--red);color:#fff}.ubtn .lt{background:#eee;color:var(--ink)}
#upd.spin svg{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.logo{border:0;background:none;padding:0;display:flex}
.menu{text-align:center;padding:26px 0 10px}.menu img{border-radius:22px;box-shadow:0 6px 20px #e31e2433}.menu h2{margin:12px 0 2px;color:var(--navy)}.menu p{margin:0;color:var(--mute)}
.splash{position:fixed;inset:0;z-index:8;overflow:hidden;padding-top:env(safe-area-inset-top);background:linear-gradient(#0008,#0006 40%,#000a),url(splash.jpg) center/cover #5a0a0f;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;text-align:center;padding:24px 24px calc(48px + env(safe-area-inset-bottom))}
.badge{display:flex;gap:6px}
.badge span{width:clamp(36px,12vw,54px);aspect-ratio:1;display:grid;place-items:center;border:3px solid #fff;border-radius:6px;color:#fff;font-weight:800;font-size:clamp(22px,7.5vw,34px);text-shadow:0 2px 8px #0008;box-shadow:0 2px 10px #0006}
.splash .sub{font-size:clamp(24px,8vw,38px);font-weight:800;margin-top:14px;color:#fff;text-shadow:0 2px 10px #000a}
.splash .tag{margin-top:8px;color:#fff;font-weight:600;letter-spacing:1px;text-transform:uppercase;font-size:13px;text-shadow:0 2px 8px #000a}
.splash .go{margin-top:28px;border:0;background:#e31e24;color:#fff;border-radius:12px;padding:14px 38px;font:700 17px inherit;font-family:inherit;box-shadow:0 6px 18px #0008}
.splash .go{min-width:min(78vw,300px)}
.splash .go.ghost{margin-top:12px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.55);box-shadow:none}
body.on-splash #lang{z-index:9;top:calc(14px + env(safe-area-inset-top));bottom:auto}
#toast{z-index:25}
[hidden]{display:none!important}
</style>
</head>
<body class="on-splash">
<header>
  <button class="logo" data-go="splash" aria-label="First cover page"><img src="icons/icon-192.png" alt="AMB logo"></button>
  <h1>Anaemia Mukt Bharat<small>Screening &amp; treatment guide</small></h1>
  <button class="pill" id="homeBtn" data-go="info" aria-label="Home">🏠</button>
  <button class="pill" id="net" aria-label="Connection status"><i class="dot"></i><span>Online</span></button>
  <button class="pill inst" id="install" hidden>⬇ Install</button>
</header>
<main>
  <section class="tab on" id="t-splash">
    <div class="splash">
      <div class="badge" role="img" aria-label="Anemia"><span>A</span><span>N</span><span>E</span><span>M</span><span>I</span><span>A</span></div>
      <div class="sub">Mukt Bharat</div>
      <div class="tag">Anemia Free India Campaign</div>
      <button class="go" data-go="info">Continue →</button>
      <button class="go ghost" id="coverInstall" type="button" hidden>Install app</button>
    </div>
  </section>
  <section class="tab" id="t-info">
    <img class="cover" src="cover.jpg" alt="Anaemia Mukt Bharat – Anaemia Free India Campaign">
    <h2 class="sec">Know the symptoms &amp; signs</h2>
    <img class="cover pic" src="symptoms.jpg" alt="Symptoms (ଲକ୍ଷଣ)">
    <img class="cover pic" src="signs.jpg" alt="Signs (ଚିହ୍ନ)">
    <img class="cover pic" src="clinical.jpg" alt="Clinical signs of anaemia: tongue, palm, eyelid, nail">
    <button class="btn" data-go="home">Continue →</button>
  </section>
  <section class="tab" id="t-home">
    <div class="menu">
      <img src="icons/icon-192.png" alt="" width="96" height="96">
      <h2>Anaemia Mukt Bharat</h2>
      <p>Screening &amp; treatment guide</p>
    </div>
    <button class="btn" data-go="screen">＋ New Screening</button>
    <button class="btn ghost" data-go="records">View Saved Records</button>
  </section>
  <section class="tab" id="t-screen">
    <div id="form"></div>
    <button class="btn" id="save">Save Record</button>
    <button class="btn ghost" id="reset">Clear Form</button>
  </section>
  <section class="tab" id="t-records">
    <div id="recs"></div>
    <button class="btn alt" id="csv">⬇ Export CSV</button>
  </section>
</main>
<nav>
  <button class="on" data-go="home"><span>🏠</span>Home</button>
  <button data-go="screen"><span>🩸</span>Screen</button>
  <button data-go="records"><span>📋</span>Records <b id="cnt"></b></button>
</nav>
<button id="lang" aria-label="Change language">ଓଡ଼ିଆ</button>
<div id="upd" hidden>
  <svg viewBox="0 0 56 56" width="56" height="56"><circle cx="28" cy="28" r="24" fill="none" stroke="#f0d9d6" stroke-width="6"/><circle id="ring" cx="28" cy="28" r="24" fill="none" stroke="#e31e24" stroke-width="6" stroke-linecap="round" stroke-dasharray="150.8" stroke-dashoffset="150.8" transform="rotate(-90 28 28)"/><text id="pct" x="28" y="33" text-anchor="middle" font-size="14" font-weight="700" fill="#14213d">0%</text></svg>
  <div class="utx"><b id="utitle">Update available</b><small id="usub"></small></div>
  <div class="ubtn"><button id="ugo">Update</button><button id="ulater" class="lt">Later</button></div>
</div>
<div id="toast"></div>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
